<!doctype html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  />


  <script>
    (function () {

      const STORAGE_KEY =
              'video-study:theme';

      const storedTheme =
              localStorage.getItem(
                      STORAGE_KEY
              );

      const systemTheme =
              window.matchMedia(
                      '(prefers-color-scheme: dark)'
              ).matches
                      ? 'dark'
                      : 'light';

      const theme =
              storedTheme === 'dark' ||
              storedTheme === 'light'
                      ? storedTheme
                      : systemTheme;

      document
              .documentElement
              .setAttribute(
                      'data-theme',
                      theme
              );

    })();
  </script>


  <title>
    Video Study
  </title>

</head>


<body>

<div id="root"></div>

<script
        type="module"
        src="/src/main.tsx"
></script>

</body>

</html>
